brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
# асинхронный сброс commitlog, как commitlog у Scylla/Cassandra
flushDiskType = ASYNC_FLUSH
storePathRootDir = /home/rocketmq/store
deleteWhen = 04
fileReservedTime = 48
autoCreateTopicEnable = false
# таймер-сообщения с произвольным временем доставки (RocketMQ 5)
timerWheelEnable = true
timerMaxDelaySec = 259200
timerPrecisionMs = 1000
# отдавать консюмеру до 1000 сообщений за pull (как READ_PAGE_LIMIT у остальных)
maxTransferCountOnMessageInMemory = 1000
maxTransferBytesOnMessageInMemory = 1048576
maxTransferCountOnMessageInDisk = 1000
maxTransferBytesOnMessageInDisk = 1048576
# по умолчанию 200 мс: под батчевым prefill брокер слишком рано отвечает "broker busy"
waitTimeMillsInSendQueue = 1000
